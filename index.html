<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzas" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Mis Finanzas</title>
    <style>
      /* Interruptor mobile/desktop, escrito a mano para que ningún
         bundler lo reescriba a sintaxis moderna de media query
         (incompatible con Safari < 16.4). No tocar vía Tailwind. */
      .app-desktop-sidebar {
        display: none;
      }
      .app-mobile-tabbar {
        display: flex;
      }
      .app-mobile-only {
        display: block;
      }
      .app-desktop-only {
        display: none;
      }
      @media (min-width: 768px) {
        .app-desktop-sidebar {
          display: flex;
        }
        .app-mobile-tabbar {
          display: none;
        }
        .app-mobile-only {
          display: none;
        }
        .app-desktop-only {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
